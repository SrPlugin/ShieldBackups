[package]
name = "sb-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `rustix` gives access to `kill(-pgid)` --killing the whole group, which is what
# takes the plugin's grandchildren down with it-- through a safe API. The
# alternative, `libc::kill`, would require `unsafe`, and the workspace forbids it.
rustix = { version = "1.1.4", features = ["process"] }
# The `zstd -> age -> SHA-256` pipeline lives in `sb-crypto`: the core composes it
# between the two data channels, but reimplements none of it.
sb-crypto = { version = "0.1.0", path = "../sb-crypto" }
sb-proto = { version = "0.1.0", path = "../sb-proto" }
sb-transport = { version = "0.1.0", path = "../sb-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
thiserror = { workspace = true }
# Converting seconds since the epoch into a civil UTC date has rules (leap years,
# the exception for multiples of 400) that are not worth reimplementing on a path
# that decides where an artifact is written. Only the accessors (`year`, `month`,
# ...) are used and the timestamp is composed with `format!`, so the
# `formatting`/`parsing`/`macros` features and the proc-macro dependency they drag
# in are not needed.
time = "0.3.55"
# The workspace's tokio already brings `process`, `io-util`, `time`, `net`,
# `macros` and `rt-multi-thread`, which is everything plugin startup needs: there
# is no need to enable anything extra just for this crate.
tokio.workspace = true
toml = "1.1.4"
# The control channel is gRPC: the core needs tonic's `Channel` to build the
# clients generated in `sb-proto`.
tonic = "0.14.6"
tracing.workspace = true

[dev-dependencies]
# The mock's deterministic generator, so the test can regenerate what the engine
# claimed to produce and compare digests instead of taking its word for it.
sb-plugin-mock = { version = "0.1.0", path = "../../plugins/sb-plugin-mock" }
tempfile = "3.27.0"
proptest = { workspace = true }

[package]
name = "sb-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `rustix` da acceso a `kill(-pgid)` —matar al grupo entero, que es lo que se
# lleva por delante a los nietos del plugin— con una API segura. La
# alternativa, `libc::kill`, exigiría `unsafe`, y el workspace lo prohíbe.
rustix = { version = "1.1.4", features = ["process"] }
sb-proto = { version = "0.1.0", path = "../sb-proto" }
sb-transport = { version = "0.1.0", path = "../sb-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
thiserror = { workspace = true }
# Convertir segundos desde el epoch a fecha civil UTC tiene reglas (años
# bisiestos, la excepción de los múltiplos de 400) que no merece la pena
# reimplementar en un camino que decide dónde se escribe un artefacto. Solo se
# usan los accesores (`year`, `month`, ...) y la marca se compone con
# `format!`, así que no hacen falta las features `formatting`/`parsing`/`macros`
# ni la dependencia de proc-macros que arrastran.
time = "0.3.55"
# El tokio del workspace ya trae `process`, `io-util`, `time`, `net`, `macros`
# y `rt-multi-thread`, que es todo lo que necesita el arranque de plugins: no
# hace falta activar nada extra solo para este crate.
tokio.workspace = true
toml = "1.1.4"
# El canal de control es gRPC: el núcleo necesita el `Channel` de tonic para
# construir los clientes generados en `sb-proto`.
tonic = "0.14.6"
tracing.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

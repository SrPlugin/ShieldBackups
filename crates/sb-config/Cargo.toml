[package]
name = "sb-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
toml = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
sb-crypto = { version = "0.1.0", path = "../sb-crypto" }
# Configuration validation is done against the schema the plugin declares over
# gRPC, and it produces the protocol's `Value`s that travel in `Configure`: both
# types live in the contract.
sb-proto = { version = "0.1.0", path = "../sb-proto" }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }

[package]
name = "sb-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
toml = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
sb-crypto = { version = "0.1.0", path = "../sb-crypto" }
# La validación de la configuración se hace contra el esquema que el plugin
# declara por gRPC, y produce los `Value` del protocolo que viajan en
# `Configure`: ambos tipos viven en el contrato.
sb-proto = { version = "0.1.0", path = "../sb-proto" }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3"

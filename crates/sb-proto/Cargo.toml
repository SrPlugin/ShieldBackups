[package]
name = "sb-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tonic = "0.14.6"
# The code `tonic-prost-build` generates references `tonic_prost::ProstCodec`,
# so this crate is a runtime dependency, not just a build one.
tonic-prost = "0.14.6"
prost = "0.14.4"

[build-dependencies]
tonic-prost-build = "0.14.6"
prost-build = "0.14.4"
# Ships a precompiled protoc binary. Without it, building the project requires
# installing the protobuf compiler by hand on every machine and in CI.
protoc-bin-vendored = "3.2.0"

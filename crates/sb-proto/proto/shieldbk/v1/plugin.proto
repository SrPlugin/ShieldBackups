syntax = "proto3";

package shieldbk.v1;

// Every plugin implements this service. On top of it, a plugin implements
// any of Source, Storage, Notifier and Drill, and declares which in Info.
service Plugin {
  // First RPC over the already-authenticated channel. Confirms identity and
  // capabilities.
  rpc Info      (InfoRequest)      returns (InfoResponse);
  // Describes the configuration fields the plugin accepts.
  rpc Schema    (SchemaRequest)    returns (SchemaResponse);
  // Delivers the validated configuration, including already-resolved secrets.
  rpc Configure (ConfigureRequest) returns (ConfigureResponse);
  // Checks connectivity, permissions and dependencies. Used by `doctor`.
  rpc Preflight (PreflightRequest) returns (PreflightResponse);
  // Orderly shutdown.
  rpc Shutdown  (ShutdownRequest)  returns (ShutdownResponse);
}

// Something that produces a stream of bytes and can be rebuilt from one.
//
// That contract is deliberately wider than a database: a source is anything
// that can be serialized into a byte stream and restored from it. A `pg_dump`
// is one, but so are a directory piped through tar, a Docker volume, a virtual
// machine's disk or a bucket being copied to another provider. Nothing in this
// service knows what is on the other end of the stream.
//
// The RPCs keep the names `Dump` and `Restore` because they describe the
// operation -- serialize out, rebuild in -- and not the kind of thing being
// serialized.
service Source {
  rpc Dump    (DumpRequest)    returns (stream Progress);
  rpc Restore (RestoreRequest) returns (stream Progress);
}

service Storage {
  rpc Put             (PutRequest)             returns (stream Progress);
  rpc Get             (GetRequest)             returns (stream Progress);
  rpc List            (ListRequest)            returns (ListResponse);
  rpc Delete          (DeleteRequest)          returns (DeleteResponse);
  // Cleans up incomplete multipart uploads. Without this, a failure leaves
  // orphaned parts that the provider keeps billing for.
  rpc AbortIncomplete (AbortIncompleteRequest) returns (AbortIncompleteResponse);
}

// Something that wants to hear how a command went: Slack, Discord, a mailbox, a
// ticket, a dead-man's-switch URL. The core never knows which -- it hands every
// notifier the same event and the plugin decides what to do with it.
//
// Delivery is best-effort by design: a notifier that fails is reported on
// stderr and never changes the exit code of the command it was telling about.
service Notifier {
  rpc Notify (NotifyRequest) returns (NotifyResponse);
}

// A source that can prove its own backups restore: it knows how to make a
// disposable place to restore into, how to ask whether what landed there is
// right, and how to throw that place away.
//
// A plugin implementing Drill also implements Source, and the two are the same
// process: between Provision and Teardown, Source.Restore writes into the
// disposable place and **never** into what the plugin was configured to back up.
// Which place that is, and how it is made, is the plugin's business -- a scratch
// database, a temporary directory, a throwaway volume. The core only runs the
// sequence and reports the verdict.
//
// It is additive, like Notifier: a source that does not implement it keeps
// working for everything but `shieldbk drill`.
service Drill {
  // Creates the disposable place. From here on, Source.Restore writes there.
  rpc Provision (ProvisionRequest) returns (ProvisionResponse);
  // Asks whether what was restored is right. A check that does not hold is an
  // answer (ok = false), not an error: the RPC only fails when the question
  // could not be asked at all.
  rpc Check     (CheckRequest)     returns (CheckResponse);
  // Throws the disposable place away. Idempotent: with nothing provisioned it
  // succeeds, and the core calls it whatever happened before.
  rpc Teardown  (TeardownRequest)  returns (TeardownResponse);
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_SOURCE      = 1;
  CAPABILITY_STORAGE     = 2;
  CAPABILITY_NOTIFIER    = 3;
  CAPABILITY_DRILL       = 4;
}

message InfoRequest {}
message InfoResponse {
  string              name             = 1;
  string              version          = 2;
  uint32              protocol_version = 3;
  repeated Capability capabilities     = 4;
}

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_STRING      = 1;
  FIELD_TYPE_INT         = 2;
  FIELD_TYPE_BOOL        = 3;
  FIELD_TYPE_DURATION    = 4;
  FIELD_TYPE_PATH        = 5;
  FIELD_TYPE_LIST        = 6;
}

message Field {
  string    name          = 1;
  FieldType type          = 2;
  bool      required      = 3;
  // A secret field is never printed, never logged and never accepts a literal
  // value in the configuration file.
  bool      secret        = 4;
  string    description   = 5;
  string    default_value = 6;
}

message SchemaRequest {}
message SchemaResponse { repeated Field fields = 1; }

message StringList { repeated string values = 1; }

message Value {
  oneof kind {
    string     string_value = 1;
    int64      int_value    = 2;
    bool       bool_value   = 3;
    StringList list_value   = 4;
  }
}

message ConfigureRequest { map<string, Value> config = 1; }
message ConfigureResponse {}

message Check {
  string name        = 1;
  bool   ok          = 2;
  string detail      = 3;
  // What to do to fix it. A preflight that says "it failed" without saying how
  // to fix it is worth nothing.
  string remediation = 4;
}

message PreflightRequest {}
message PreflightResponse {
  bool           ok             = 1;
  repeated Check checks         = 2;
  // Version of whatever the source sits in front of, for the manifest: the
  // database server, the container runtime, the hypervisor. Empty when the
  // source has no such notion -- a plain directory does not have a version.
  string         source_version = 3;
}

message ShutdownRequest {}
message ShutdownResponse {}

// Path of the Unix socket the bytes flow through. The plugin connects to it.
//
// PROTOCOL REQUIREMENT: the plugin must return the RPC response (the stream
// headers) BEFORE it starts writing to the data socket, and do the work in a
// separate task. A plugin that writes first and responds afterwards blocks the
// core, which waits for that response before starting up the other end of the
// pipeline. The Rust SDK guarantees this; a plugin written without it must
// honour the requirement explicitly.
// WRITING A PLUGIN OUTSIDE RUST — three things that are invisible until they
// bite, learned by writing the worked example in docs/plugins/examples:
//
//   * The core connects with ALPN "h2". A TLS server that does not negotiate
//     it will route the connection to its HTTP/1 path and answer the HTTP/2
//     preface with a 403; the client then reports a framing error that points
//     nowhere near the real cause.
//   * "Answer before writing" (above) usually needs an explicit call. Response
//     headers are not flushed until the first write in most gRPC libraries, so
//     the natural implementation deadlocks. In grpc-js it is
//     `call.sendMetadata(new grpc.Metadata())`; other stacks name it
//     send-initial-metadata or similar.
//   * Field names travel as written here. Loaders that camel-case by default
//     will turn `data_socket` into `dataSocket`, and the RPC then arrives with
//     an empty path. In @grpc/proto-loader that is `keepCase: true`.

message DumpRequest    { string data_socket = 1; }
message RestoreRequest { string data_socket = 1; }

message Progress {
  uint64 bytes   = 1;
  string message = 2;
}

message PutRequest {
  string key         = 1;
  string data_socket = 2;
}
message GetRequest {
  string key         = 1;
  string data_socket = 2;
}

message ArtifactMeta {
  string key         = 1;
  uint64 size        = 2;
  // Last-modified timestamp in **RFC-3339, time in UTC with a `Z` suffix**:
  // `2026-08-21T09:30:00Z`. The format is part of the contract, not something
  // each plugin gets to choose.
  //
  // Exactly twenty characters, `YYYY-MM-DDTHH:MM:SSZ`, **with no fractional
  // seconds**. The precision is part of the contract too: if one target sent
  // milliseconds and another did not, their strings would stop being
  // comparable with each other — `…:15Z` and `…:15.983Z` differ at character
  // 19, where `Z` sorts above `.` — and the older artifact would come out
  // ahead of the newer one. A target that receives more precision from the
  // server trims it.
  //
  // Without pinning this down, two equally correct targets return
  // incomparable things — one the epoch in seconds, the other ISO-8601 — and
  // the core can neither sort nor compare artifacts across targets: it would
  // fail silently, treating whatever has the greater string as the more
  // recent.
  //
  // RFC-3339 is chosen over the epoch for two reasons: it sorts the same as
  // text as it does as a date — so comparing strings already means comparing
  // instants — and an operator can read it without converting anything.
  //
  // If the target does not know the timestamp, **the empty string**. Never a
  // made-up value and never a zero: a fake timestamp is indistinguishable from
  // a real one and would end up deciding what gets deleted under a retention
  // policy.
  string modified_at = 3;
}

message ListRequest  { string prefix = 1; }
message ListResponse { repeated ArtifactMeta artifacts = 1; }

// What happened, exactly as the command reported it.
message NotifyRequest {
  // The command that ran: `backup`, `restore`, `verify`, `doctor`, `drill`,
  // `storage gc` or `storage prune`.
  string command     = 1;
  // Whether it succeeded. A `doctor` that found problems is not ok.
  bool   ok          = 2;
  // The very JSON document `--format json` prints for that run, verdict
  // included (`ok`, and `class`/`code`/`error` when it failed). Its shape is
  // the command's public contract, so a notifier can rely on it as much as a
  // script piping `jq` does.
  string report_json = 3;
}
message NotifyResponse {}

message ProvisionRequest {}
message ProvisionResponse {
  // Where restores now land, for the report: a database name, a directory.
  // Never a credential.
  string description = 1;
}

message CheckRequest {
  // What to ask, exactly as the operator wrote it in `[target.drill] check`.
  // The core does not interpret it: what a query means is the plugin's.
  string query = 1;
}
message CheckResponse {
  bool   ok     = 1;
  // Why, in a line: what the check saw. Shown in the report whether it passed
  // or not.
  string detail = 2;
}

message TeardownRequest {}
message TeardownResponse {}

message DeleteRequest  { string key = 1; }
message DeleteResponse {}

message AbortIncompleteRequest  { string prefix = 1; }
message AbortIncompleteResponse { uint32 aborted = 1; }

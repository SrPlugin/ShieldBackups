[package]
name = "sb-plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Plugin mínimo real, usado por tests/smoke.rs para ejercitar el arranque
# completo: sobre por stdin, mTLS, anuncio por stdout y una llamada gRPC.
# Vive bajo tests/ para no ensuciar src/ ni acabar en el paquete publicado.
[[bin]]
name = "sb-plugin-smoke"
path = "tests/bin/smoke_plugin.rs"

[lints]
workspace = true

[dependencies]
sb-proto = { path = "../sb-proto" }
sb-transport = { path = "../sb-transport" }
tonic = "0.14"
# `io-std` no está en las features del workspace: solo el SDK lee stdin de forma
# asíncrona, porque solo un plugin recibe su sobre de arranque por ahí.
tokio = { workspace = true, features = ["io-std"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[package]
name = "sb-plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A real minimal plugin, used by tests/smoke.rs to exercise the full startup:
# envelope on stdin, mTLS, announcement on stdout and one gRPC call. It lives
# under tests/ so it does not clutter src/ nor end up in the published package.
[[bin]]
name = "sb-plugin-smoke"
path = "tests/bin/smoke_plugin.rs"

[lints]
workspace = true

[dependencies]
sb-proto = { version = "0.1.0", path = "../sb-proto" }
sb-transport = { version = "0.1.0", path = "../sb-transport" }
tonic = "0.14"
# `io-std` is not in the workspace features: only the SDK reads stdin
# asynchronously, because only a plugin receives its bootstrap envelope there.
tokio = { workspace = true, features = ["io-std"] }
tokio-stream = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"

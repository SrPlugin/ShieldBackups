[package]
name = "sb-plugin-r2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The plugin's logic is also exposed as a library so that
# `tests/integration.rs` can exercise it against a real MinIO: over gRPC there
# is no way to look inside the bucket, and the parts of a half-uploaded
# multipart are only visible from the inside.
[lib]
name = "sb_plugin_r2"
path = "src/lib.rs"

[[bin]]
name = "sb-plugin-r2"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sb-plugin-sdk = { version = "0.1.0", path = "../../crates/sb-plugin-sdk" }
# Without `default-features`: the default set includes the `rustls` feature,
# which in the AWS SDK is not the modern TLS client but the *legacy* one
# (hyper 0.14 + rustls 0.21 + h2 0.3). That parallel tree compiles, links, goes
# unused -- the real client comes from `default-https-client` -- and drags in
# RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101) and RUSTSEC-2026-0258 (h2
# 0.3). Here the rest of the default set is repeated and that one is left out.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-config = "1"
aws-credential-types = "1"
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Only the tests need the transport: there they play the role of the core --
# creating the data channel and the bootstrap envelope -- not of a plugin.
sb-transport = { version = "0.1.0", path = "../../crates/sb-transport" }
tempfile = "3"
# MinIO speaks the S3 protocol and runs in Docker, so it allows exercising the
# whole plugin without Cloudflare credentials and at no cost. What it does
# **not** validate is R2's rule that every part of a multipart except the last
# must be the same size: MinIO is more permissive. That rule is pinned down by
# `tests/integration.rs` anyway, and is checked against real R2 in another task.
#
# `testcontainers-modules` 0.15 requires `testcontainers` ^0.27, so it cannot be
# bumped to 0.28 here until the corresponding module is released.
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["minio"] }

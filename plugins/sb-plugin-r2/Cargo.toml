[package]
name = "sb-plugin-r2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# La lógica del plugin se expone también como librería para que
# `tests/integracion.rs` pueda ejercitarla contra un MinIO real: por gRPC no se
# puede mirar dentro del bucket, y las partes de un multipart a medio subir
# solo se ven desde dentro.
[lib]
name = "sb_plugin_r2"
path = "src/lib.rs"

[[bin]]
name = "sb-plugin-r2"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sb-plugin-sdk = { version = "0.1.0", path = "../../crates/sb-plugin-sdk" }
# Sin `default-features`: el conjunto por defecto incluye la feature `rustls`,
# que en el SDK de AWS no es el cliente de TLS moderno sino el *legacy*
# (hyper 0.14 + rustls 0.21 + h2 0.3). Ese árbol paralelo se compila, se
# enlaza, no se usa —el cliente real sale de `default-https-client`— y arrastra
# RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101) y RUSTSEC-2026-0258 (h2
# 0.3). Aquí se repite el resto del conjunto por defecto y se deja fuera esa.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-config = "1"
aws-credential-types = "1"
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Solo los tests necesitan el transporte: ahí se hace de núcleo —crear el canal
# de datos y el sobre de arranque—, no de plugin.
sb-transport = { version = "0.1.0", path = "../../crates/sb-transport" }
tempfile = "3"
# MinIO habla el protocolo de S3 y corre en Docker, así que permite ejercitar el
# plugin entero sin credenciales de Cloudflare ni coste. Lo que **no** valida es
# la regla de R2 de que todas las partes de un multipart salvo la última midan
# lo mismo: MinIO es más permisivo. Esa regla la fija igualmente
# `tests/integracion.rs`, y se comprueba contra R2 real en otra tarea.
#
# `testcontainers-modules` 0.15 exige `testcontainers` ^0.27, así que aquí no se
# puede subir a 0.28 mientras no salga el módulo correspondiente.
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["minio"] }

[package]
name = "sb-plugin-mock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sb-plugin-mock"
path = "src/main.rs"

# El generador de datos se expone también como librería para que los tests del
# núcleo puedan regenerar exactamente lo que el motor produjo y compararlo.
[lib]
name = "sb_plugin_mock"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# El SDK es la única dependencia del plugin: reexporta sb-proto, tonic y
# `connect_data`, que es todo lo que hace falta para hablar con el núcleo.
sb-plugin-sdk = { path = "../../crates/sb-plugin-sdk" }
tokio = { workspace = true }
# `ArtifactMeta.modified_at` es RFC-3339 UTC por contrato, y convertir segundos
# desde el epoch a fecha civil tiene reglas —bisiestos, la excepción de los
# múltiplos de 400— que no merece la pena reimplementar. Como en `sb-core`,
# solo se usan los accesores y la cadena se compone con `format!`: no hacen
# falta las features `formatting`/`parsing`/`macros`.
time = "0.3.55"
tracing = { workspace = true }

[dev-dependencies]
# Solo los tests necesitan el transporte: ahí se hace de núcleo —montar el
# sobre, la PKI efímera y los canales de datos—, no de plugin.
sb-transport = { path = "../../crates/sb-transport" }
tempfile = "3"

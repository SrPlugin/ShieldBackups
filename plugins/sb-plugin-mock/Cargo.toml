[package]
name = "sb-plugin-mock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "sb-plugin-mock"
path = "src/main.rs"

# The data generator is also exposed as a library so that the core's tests can
# regenerate exactly what the engine produced and compare against it.
[lib]
name = "sb_plugin_mock"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# The SDK is the plugin's only dependency: it re-exports sb-proto, tonic and
# `connect_data`, which is everything needed to talk to the core.
sb-plugin-sdk = { version = "0.1.0", path = "../../crates/sb-plugin-sdk" }
tokio = { workspace = true }
# `ArtifactMeta.modified_at` is RFC-3339 UTC by contract, and converting seconds
# since the epoch into a civil date has rules -- leap years, the multiple-of-400
# exception -- that are not worth reimplementing. As in `sb-core`, only the
# accessors are used and the string is composed with `format!`: the
# `formatting`/`parsing`/`macros` features are not needed.
time = "0.3.55"
tracing = { workspace = true }

[dev-dependencies]
# Only the tests need the transport: there they play the role of the core --
# setting up the envelope, the ephemeral PKI and the data channels -- not of a
# plugin.
sb-transport = { version = "0.1.0", path = "../../crates/sb-transport" }
tempfile = "3"

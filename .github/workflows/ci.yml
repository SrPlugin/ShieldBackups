name: CI

on:
  push:
  pull_request:
  # The memory tests: see the `memory` job.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The gate every push goes through: formatting, lints, documentation and the
  # test suite. If this fails, nothing else matters.
  check:
    name: format, clippy, doc and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-toolchain.toml` pins 1.92 and overrides whatever this action
      # installs; it is declared all the same so as not to download a different
      # toolchain first.
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Documentation rots in silence: an intra-doc link pointing at a private
      # item or at one that has been renamed breaks no build. It goes as a step
      # of this job and not as a separate job because it reuses the dependencies
      # already compiled here; on a runner of its own it would cost several
      # minutes of recompiling the whole tree for nothing.
      - name: cargo doc
        run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"
      # One thread: several tests spawn plugin processes and get in each other's
      # way if they run in parallel.
      - run: cargo test --all-features --workspace -- --test-threads=1

  # Supply-chain audit: RustSec advisories, licences, crate provenance and
  # duplicates. It is the only thing watching the transitive dependencies, which
  # is where the problem gets in on a tool that handles credentials, and it
  # compiles nothing: it costs less than two minutes. The whole configuration
  # lives in `deny.toml`.
  deny:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The tests that bring containers up: MinIO for the R2 plugin and PostgreSQL
  # for its own. They are kept apart from `check` because they need a prepared
  # environment -- a PostgreSQL client, a container daemon, a route to the image
  # registry -- and because when that environment fails the error must not read
  # as a failure of the code.
  integration:
    name: integration tests with Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      # `pg_dump` and `psql` for the PostgreSQL plugin.
      - name: install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version
      # GitHub's runners ship Docker; if they ever stopped shipping it, the
      # testcontainers tests would skip themselves and this job would go green
      # without having tested anything. Better to fail here.
      - name: check Docker
        run: docker info > /dev/null
      # `shell: bash` to get `pipefail`: with the default shell the exit code
      # would be `tee`'s and a broken test would pass for green.
      - name: full suite
        shell: bash
        run: cargo test --all-features --workspace -- --test-threads=1 --nocapture 2>&1 | tee results.txt
      # The container tests skip themselves, by design, when there is no Docker:
      # they say so on stderr and return green. Here a skip is a failure of the
      # environment, and without this it would go unnoticed.
      - name: no test skipped
        run: |
          if grep -q "^SKIPPED " results.txt; then
            echo "::error::a container test skipped itself in the job that exists to run them"
            grep "^SKIPPED " results.txt
            exit 1
          fi

  # The declared MSRV (`rust-version` in the workspace) and the pinned toolchain
  # (`rust-toolchain.toml`) have to be the same version.
  #
  # There is no build with 1.92 here: it would be a copy of the `check` job.
  # `rust-toolchain.toml` forces 1.92 in every job and on the machine of anyone
  # who clones the repository, so accidentally using a newer API already breaks
  # the normal build. What that file does *not* catch is somebody bumping the
  # channel to a newer version and leaving `rust-version` at 1.92: from then on
  # the crate advertises an MSRV nobody checks and that probably no longer
  # holds. That is what this job looks at, and why it takes seconds and not a
  # whole build.
  msrv:
    name: declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust-version and rust-toolchain.toml agree
        run: |
          declared=$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)
          pinned=$(grep -oP '^channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          echo "Cargo.toml rust-version = $declared"
          echo "rust-toolchain.toml channel = $pinned"
          if [ "$declared" != "$pinned" ]; then
            echo "::error::the declared MSRV ($declared) does not match the pinned toolchain ($pinned); CI is not testing the version the crate promises to support"
            exit 1
          fi

  # The memory tests move ~9 GiB across the disk: on every push they would be a
  # tax nobody wants to pay, and what they watch -- that the streaming pipeline
  # does not accumulate the whole backup in RAM -- changes rarely. Weekly, plus
  # a manual trigger for when that pipeline is touched.
  memory:
    name: memory usage with large backups
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      # Free space before starting: if the runner does not have it, the failure
      # shows up here and not halfway through a twenty-minute test.
      - run: df -h /
      # In release: in debug these tests take too long and measure something
      # else.
      - run: cargo test --release --all-features -p sb-cli --test memory -- --ignored --nocapture --test-threads=1
